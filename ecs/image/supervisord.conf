# Supervisord config template for the devbox.
# The entrypoint renders this with envsubst (${DEV_*}) and strips the dockerd
# program block that does not match DEV_DOCKER_MODE:
#   rootless (AWS/Fargate default): dockerd-rootless.sh as the dev user
#   root (MiniStack fallback):      plain dockerd, vfs + bridge=none
# (rootlesskit cannot run inside a container whose mount namespace is owned
# by the initial user namespace — plain-Docker-in-rootless is impossible.)

[unix_http_server]
file=/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dockerd-rootless]
; Rootless dockerd as the dev user: XDG_RUNTIME_DIR must exist and be owned
; by that uid; vfs storage driver when /dev/fuse is unavailable.
command=/bin/bash -lc 'export XDG_RUNTIME_DIR=/run/user/%(ENV_DEV_UID)s DOCKER_HOST=unix:///run/user/%(ENV_DEV_UID)s/docker.sock DOCKERD_ROOTLESS_ROOTLESSKIT_DETACH_NETNS=0; exec dockerd-rootless.sh --storage-driver=vfs'
user=%(ENV_DEV_USER)s
environment=XDG_RUNTIME_DIR="/run/user/%(ENV_DEV_UID)s",HOME="%(ENV_DEV_HOME)s"
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/dockerd-rootless.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/dockerd-rootless.err.log
stderr_logfile_maxbytes=10MB

[program:dockerd-root]
; Docker-in-Docker fallback for MiniStack: the task container has
; CAP_SYS_ADMIN (passed through the task def), vfs needs no overlay support,
; and bridge=none + iptables=false avoid kernel netfilter requirements.
; Nested containers reach the world via --network=host.
command=/bin/bash -lc 'exec dockerd --storage-driver=vfs --iptables=false --ip6tables=false --bridge=none --ip-forward=false --ip-masq=false --data-root=/var/lib/docker-dind --exec-root=/run/docker-dind --host=unix:///var/run/docker-dind.sock --pidfile=/run/docker-dind.pid'
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/dockerd-dind.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/dockerd-dind.err.log
stderr_logfile_maxbytes=10MB